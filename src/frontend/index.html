<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Médico | Acceso</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="app">
        
        <div class="auth-container">
            <div class="auth-header">
                <h2>Portal Médico</h2>
                <p id="auth-subtitle">Ingrese sus credenciales para continuar</p>
            </div>

            <form id="form-login" class="auth-form active">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="dr.apellido@hospital.com">
                    <span class="error-msg" id="error-login-email" style="color: red; font-size: 12px; display: block; margin-top: 5px;"></span>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <p class="toggle-text">¿No está registrado? <span onclick="toggleAuthView('register')">Crear cuenta</span></p>
            </form>

            <form id="form-register" class="auth-form">
                <div class="input-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="reg-name" required placeholder="Ej. Dr. Francisco Zerpa">
                </div>
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="reg-email" required placeholder="dr.apellido@hospital.com">
                    <span class="error-msg" id="error-reg-email" style="color: red; font-size: 12px; display: block; margin-top: 5px;"></span>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Registrar Médico</button>
                <p class="toggle-text">¿Ya tiene cuenta? <span onclick="toggleAuthView('login')">Iniciar Sesión</span></p>
            </form>
        </div>

    </div>

    <script src="js/main.js"></script>
</body>
</html>
